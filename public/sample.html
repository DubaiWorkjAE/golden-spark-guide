<style>
/* Layout: phone = one column; tablet (640+) = 2-col categories, 3-col products; desktop (1024+) = hero text + video side by side,
   4-col categories, category/product pages split into text and media columns. Sticky header + category chips; language + WhatsApp bottom-right.
   Single light brand look by choice: navy + gold on white. Video-first previews; keywords turn brand blue; previews zoom slowly. */
:root {
  --blue: #2E3A8C;
  --navy: #282C55;
  --navy-deep: #262948;
  --gold: #F1C854;
  --gold-ink: #85601F;
  --paper: #FFFFFF;
  --mist: #F5F5F7;
  --ink: #1D1D1F;
  --muted: #62626A;
  --line: #E3E3E8;
  --ph: #ECECF1;
  --ph-line: #B9B9C4;
  --wa: #0B7F3D;
  --wa-hover: #096B33;
  --note: #FFF6DA;
  --note-ink: #5E4510;
  --display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --arabic: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); }
html[lang="ar"] body, html[lang="ar"] .display { font-family: var(--arabic); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.display { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; }

/* Header + chips */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar { height: 56px; display: flex; align-items: center; gap: 10px; }
.mark { width: 32px; height: 32px; border-radius: 8px; background: var(--navy-deep); color: var(--gold); display: grid; place-items: center; font: 800 13px var(--display); flex: none; }
.brand { font: 700 16px var(--display); color: var(--navy); text-decoration: none; display: flex; align-items: center; gap: 10px; }
.back { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--mist); display: grid; place-items: center; flex: none; }
.bar .spacer { flex: 1; }
.contact { font-size: 14px; font-weight: 500; text-decoration: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 8px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding-inline: 14px; border-radius: 18px; background: var(--mist); color: var(--ink); display: flex; align-items: center; font-size: 14px; text-decoration: none; white-space: nowrap; }
.chip[aria-current="page"] { background: var(--navy); color: #FFFFFF; font-weight: 600; }

/* Placeholders */
.ph { background: var(--ph); border: 1px dashed var(--ph-line); border-radius: 12px; color: var(--muted); font-size: 12px; display: grid; place-items: center; text-align: center; padding: 8px; }
.ph.video { width: min(240px, 70%); aspect-ratio: 9 / 16; margin-inline: auto; border-radius: 18px; gap: 10px; align-content: center; }
.play { width: 56px; height: 56px; border-radius: 28px; background: rgba(38, 41, 72, 0.88); display: grid; place-items: center; margin-inline: auto; }

/* Hero */
.hero { background: #3A3E66; color: #FFFFFF; position: relative; }
.hero .wrap { position: relative; padding-block: 140px 24px; display: grid; gap: 16px; }
.hero-copy { position: relative; display: grid; gap: 16px; }
.eyebrow { margin: 0; color: var(--gold); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.hero h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); line-height: 1.08; font-weight: 800; }
.hero p.sub { margin: 0; font-size: 17px; color: #E4E5F0; }
.btn-gold { height: 52px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 16px; }
.logos { padding: 12px; border-radius: 12px; background: rgba(20, 22, 45, 0.7); border: 1px solid rgba(255, 255, 255, 0.18); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.logos span { height: 36px; border: 1px dashed #8C90B4; border-radius: 5px; color: #D5D7E8; font-size: 10px; display: grid; place-items: center; text-align: center; }

/* Sections */
.section { padding-block: 28px; display: grid; gap: 12px; }
.section h2 { margin: 0; color: var(--navy); font-size: 26px; line-height: 1.15; font-weight: 800; }
.lead { margin: 0; color: var(--muted); font-size: 15px; }
.group-label { margin: 10px 0 0; color: var(--gold-ink); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.cat { min-height: 104px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); background: var(--paper); }
.cat:hover { border-color: var(--navy); }
.cat > .media { flex: 0 0 96px; height: 96px; }
.cat-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.cat-title { font: 700 17px var(--display); color: var(--navy); }
html[lang="ar"] .cat-title { font-family: var(--arabic); }
.cat-line { font-size: 13px; color: var(--muted); }
.pill { justify-self: start; padding: 2px 9px; border-radius: 10px; background: var(--mist); font-size: 12px; font-weight: 600; }
.chev { flex: none; color: var(--gold-ink); }
[dir="rtl"] .chev, [dir="rtl"] .back svg { transform: scaleX(-1); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.steps li { padding: 12px 10px; border-radius: 10px; background: var(--mist); font-size: 13px; line-height: 1.35; }
.steps b { display: block; color: var(--gold-ink); font-size: 18px; }

/* Category + product pages */
.page-head { padding-block: 20px 4px; display: grid; gap: 12px; }
.page-head h1 { margin: 0; color: var(--navy); font-size: clamp(28px, 7.5vw, 40px); line-height: 1.1; font-weight: 800; }
.intro { margin: 0; font-size: 17px; }
.crumb { font-size: 14px; font-weight: 500; text-decoration: none; justify-self: start; }
.facts { margin: 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; font-size: 15px; font-weight: 500; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--mist); font-size: 13px; line-height: 1.45; }
.note b { color: var(--navy); }
.small { margin: 0; color: var(--muted); font-size: 13px; }
.draft { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--note); color: var(--note-ink); font-size: 12.5px; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type { padding: 10px 6px; border-radius: 12px; border: 0; background: var(--mist); display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-align: center; }
.type svg { color: var(--navy); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 8px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; text-decoration: none; color: var(--ink); min-width: 0; }
.tile:hover { border-color: var(--navy); }
.tile-brand { color: var(--gold-ink); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.tile-name { font: 700 15px/1.25 var(--display); color: var(--navy); }
.tile-blurb { font-size: 13px; line-height: 1.35; }
.tile-meta { font-size: 12px; color: var(--muted); }
.tile-uses { font-size: 12px; font-weight: 600; color: var(--navy); }
.tile-later { font-size: 12px; color: var(--muted); font-style: italic; }
.pkg { align-self: flex-start; padding: 2px 9px; border-radius: 10px; background: #FBEFC6; color: var(--note-ink); font-size: 12px; font-weight: 600; }
.subgroup h2 { font-size: 20px; }
.ask { justify-self: center; height: 48px; padding-inline: 22px; border-radius: 24px; border: 1px solid #C9CAD9; color: var(--navy); display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; }
.seg { justify-self: center; padding: 4px; border-radius: 22px; background: var(--mist); display: flex; gap: 4px; }
.seg button { height: 38px; padding-inline: 24px; border: 0; border-radius: 19px; background: transparent; font-size: 14px; font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--navy); color: #FFFFFF; font-weight: 600; }
.ph.square { aspect-ratio: 1; width: 100%; max-width: 420px; margin-inline: auto; }
.btn-wa { height: 54px; border-radius: 27px; background: var(--wa); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
.btn-wa:hover { background: var(--wa-hover); }
.row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.row .tile { flex: 0 0 150px; }

footer { background: var(--mist); margin-top: 24px; }
footer .wrap { padding-block: 24px 120px; display: grid; gap: 12px; }
.phones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phones div { padding: 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.phones span { display: block; color: var(--muted); font-size: 12px; }
.phones b { font-size: 14px; user-select: all; }
.terms { grid-column: 1 / -1; margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.terms h2 { margin: 0; font-size: 18px; color: var(--navy); }
.terms dl { margin: 0; display: grid; gap: 12px; }
.terms dl div { display: grid; gap: 2px; }
.terms dt { font-size: 14px; font-weight: 700; color: var(--navy); }
.terms dd { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.partners { display: grid; gap: 8px; }
.partners p { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.partner-logos { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.partner-logos img { height: 40px; width: auto; border-radius: 6px; display: block; }
@media (min-width: 640px) { .terms dl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; } }
@media (min-width: 1024px) { .terms dl { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Floating language + WhatsApp: always bottom-right */
.float { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; direction: ltr; }
.lang-btn { height: 44px; padding-inline: 14px; border-radius: 22px; border: 1px solid #D5D5DC; background: var(--paper); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); }
.wa-fab { width: 56px; height: 56px; border-radius: 28px; background: var(--wa); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
/* WhatsApp language chooser: bottom sheet on phones, centred card on larger screens */
.wa-dialog { width: 100%; max-width: 100%; margin: auto 0 0; padding: 0; border: 0; border-radius: 20px 20px 0 0; background: var(--paper); color: var(--ink); }
.wa-dialog::backdrop { background: rgba(20, 22, 45, 0.55); }
.wa-sheet { padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.wa-head { display: flex; align-items: center; gap: 10px; }
.wa-head h2 { margin: 0; flex: 1; font-size: 20px; color: var(--navy); }
.wa-close { width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--mist); display: grid; place-items: center; }
.wa-close:hover { background: #E2E3EE; }
.wa-product { margin: 0; font-weight: 600; color: var(--gold-ink); }
.wa-sub { margin: 0; color: var(--muted); font-size: 14px; }
.wa-options { display: grid; gap: 8px; margin-top: 4px; }
.wa-opt { min-height: 60px; padding: 10px 12px 10px 16px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); transition: border-color .25s ease, background-color .25s ease; }
.wa-opt[aria-current="true"] { border-color: var(--navy); }
.wa-opt:hover, .wa-opt:active { border-color: var(--wa); background: #F2FAF5; }
.wa-opt-text { flex: 1; display: grid; gap: 2px; }
.wa-opt-name { font-size: 17px; font-weight: 600; color: var(--navy); }
.wa-opt-note { font-size: 13px; color: var(--muted); }
.wa-opt[lang="ar"] .wa-opt-name, .wa-opt[lang="ar"] .wa-opt-note { font-family: var(--arabic); }
.wa-opt-icon { width: 40px; height: 40px; border-radius: 20px; background: var(--wa); display: grid; place-items: center; flex: none; }
@media (min-width: 640px) {
  .wa-dialog { max-width: 420px; margin: auto; border-radius: 20px; }
}
.menu { position: absolute; right: 0; bottom: 64px; width: 220px; padding: 6px; border-radius: 16px; background: var(--paper); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25); display: grid; }
.menu p { margin: 0; padding: 8px 10px; color: var(--muted); font-size: 12px; font-weight: 600; }
.menu button { height: 46px; padding-inline: 12px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; text-align: start; }
.menu button[aria-checked="true"] { background: var(--mist); color: var(--navy); font-weight: 700; }
.menu button:hover { background: var(--mist); }

/* Hover: chips, type buttons and outline buttons fill brand blue; titles and links turn blue. Touch: same fill while pressed. */
.chip, .type, .ask, .seg button, .crumb, .contact, .cat-title, .tile-name, .btn-gold, .btn-wa { transition: background-color .25s ease, color .25s ease, border-color .25s ease, transform .2s ease; }
.type svg { transition: color .25s ease; }
@media (hover: hover) {
  .chip:hover { background: var(--navy); color: #FFFFFF; }
  .type:hover { background: var(--navy); color: #FFFFFF; }
  .type:hover svg { color: var(--gold); }
  .ask:hover { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .seg button:not([aria-selected="true"]):hover { background: #E2E3EE; color: var(--navy); }
  .crumb:hover, .contact:hover { color: var(--blue); }
  .cat:hover .cat-title, .tile:hover .tile-name { color: var(--blue); }
  .btn-gold:hover { background: #F5D673; transform: translateY(-1px); }
}
.chip:active, .type:active, .ask:active { background: var(--navy); color: #FFFFFF; }
.type:active svg { color: var(--gold); }
.btn-gold:active, .btn-wa:active { transform: scale(.98); }

/* Premium tap feel: every button presses in softly and a gold glow spreads from the finger or cursor. */
.chip, .btn-wa, .btn-gold, .ask, .type, .wa-opt, .cat, .tile, .seg button, .thumbs button, .wa-fab, .lang-btn, .back, .wa-close, .menu button { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.vctl, .vsnd { overflow: hidden; -webkit-tap-highlight-color: transparent; }
.tile, .cat, .wa-opt, .thumbs button, .wa-fab, .lang-btn, .back, .vctl, .vsnd, .wa-close, .menu button {
  transition: transform .18s cubic-bezier(.2, .7, .2, 1), border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
}
.chip:active, .btn-wa:active, .btn-gold:active, .ask:active, .type:active, .wa-opt:active, .cat:active, .tile:active, .seg button:active,
.thumbs button:active, .wa-fab:active, .lang-btn:active, .back:active, .vctl:active, .vsnd:active, .wa-close:active, .menu button:active { transform: scale(.97); }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0); background: radial-gradient(circle, var(--ripple) 0%, transparent 70%); animation: ripple .7s cubic-bezier(.2, .7, .2, 1) forwards; }
:root { --ripple: rgba(241, 200, 84, 0.55); }
.btn-wa, .wa-fab, .vctl, .vsnd, .seg button[aria-selected="true"] { --ripple: rgba(255, 255, 255, 0.5); }
@keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

/* Smooth entries: WhatsApp panel slides up (pops in on larger screens), options follow one by one, pages fade in */
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes sheet-down { to { transform: translateY(100%); } }
@keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes pop-out { to { opacity: 0; transform: scale(.97); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: no-preference) {
  .wa-dialog[open] { animation: sheet-up .42s cubic-bezier(.2, .8, .2, 1); }
  .wa-dialog[open]::backdrop { animation: fade-in .3s ease; }
  .wa-dialog.closing { animation: sheet-down .22s ease-in forwards; }
  .wa-dialog.closing::backdrop { animation: fade-out .22s ease-in forwards; }
  .wa-dialog[open] .wa-opt { animation: rise-in .45s cubic-bezier(.2, .8, .2, 1) backwards; }
  .wa-dialog[open] .wa-opt:nth-child(1) { animation-delay: .08s; }
  .wa-dialog[open] .wa-opt:nth-child(2) { animation-delay: .14s; }
  .wa-dialog[open] .wa-opt:nth-child(3) { animation-delay: .2s; }
  .menu:not([hidden]) { animation: pop-in .22s cubic-bezier(.2, .8, .2, 1); transform-origin: bottom right; }
  #view.enter { animation: rise-in .38s cubic-bezier(.2, .8, .2, 1); }
  @media (min-width: 640px) {
    .wa-dialog[open] { animation: pop-in .3s cubic-bezier(.2, .8, .2, 1); }
    .wa-dialog.closing { animation: pop-out .18s ease-in forwards; }
  }
}

/* Video-first media placeholders (real videos: autoplay, muted, loop, inline; tap-to-play fallback) */
.media { position: relative; overflow: hidden; border-radius: 12px; background: var(--ph); }
.media-inner { position: absolute; inset: 0; border: 1px dashed var(--ph-line); border-radius: inherit; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 8px; text-align: center; color: var(--muted); font-size: 12px; background: var(--ph); }
.media.ph-photo .media-inner { transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
.media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .tagline { font-size: 11px; opacity: .85; }
.media .fallback { position: absolute; inset: 0; margin: auto; width: 76px; height: 76px; padding: 0; border: 0; border-radius: 38px; background: transparent; z-index: 2; }
.media .fallback .play { width: 64px; height: 64px; border-radius: 32px; }
.vctl { position: absolute; inset-inline-end: 10px; bottom: 10px; z-index: 2; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: rgba(20, 22, 45, 0.72); display: grid; place-items: center; }
.vctl .play { width: auto; height: auto; background: none; }
.vctl:hover { background: var(--navy); }
.vsnd { position: absolute; inset-inline-start: 10px; bottom: 10px; z-index: 2; height: 44px; padding-inline: 12px 14px; border: 0; border-radius: 22px; background: rgba(20, 22, 45, 0.72); color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; transition: background-color .25s ease; }
.vsnd:hover, .vsnd[aria-pressed="true"] { background: var(--navy); }
.vsnd[aria-pressed="true"] span { display: none; }
.vsnd[aria-pressed="true"] { padding-inline: 13px; }
.verr { position: absolute; inset: auto 10px 62px; z-index: 2; margin: 0; padding: 8px 10px; border-radius: 8px; background: rgba(20, 22, 45, 0.88); color: #FFFFFF; font-size: 13px; }
.media.photo { background: #FFFFFF; border: 1px solid var(--line); }
.media.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 6%; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
.tile:hover .media.photo img, .media.photo:hover img { transform: scale(1.06); }
.media.photo.inview img { transform: scale(1.04); }
.thumbs { display: flex; justify-content: center; gap: 10px; }
.thumbs button { position: relative; width: 64px; height: 64px; padding: 0; border-radius: 10px; border: 2px solid var(--line); background: #FFFFFF; overflow: hidden; transition: border-color .25s ease; }
.thumbs button[aria-pressed="true"] { border-color: var(--navy); }
.thumbs button:hover { border-color: var(--blue); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

function renderTerms() {
  document.getElementById("terms").innerHTML = `<h2 class="display" id="terms-title">${t("termsTitle")}</h2>
    <dl>${t("terms").map(([title, text]) => `<div><dt>${title}</dt><dd>${text}</dd></div>`).join("")}</dl>
    <div class="partners"><p>${t("partners")}</p>
      <div class="partner-logos">${PARTNER_LOGOS.map(([name, src]) => `<img src="${src}" alt="${name}" height="40" loading="lazy">`).join("")}</div>
    </div>`;
}

function waNumber(l) {
  const lines = WA_LINES[l];
  let i = null;
  try { i = sessionStorage.getItem("gs-wa-" + l); } catch (e) {}
  if (i === null || !lines[i]) {
    i = Math.floor(Math.random() * lines.length);
    try { sessionStorage.setItem("gs-wa-" + l, String(i)); } catch (e) {}
  }

// Tap feel: gold glow from the tap point, plus a very short vibration on phones that support it (Android).
const TAPPABLE = ".chip, .btn-wa, .btn-gold, .ask, .type, .wa-opt, .cat, .tile, .seg button, .thumbs button, .wa-fab, .lang-btn, .back, .vctl, .vsnd, .wa-close, .menu button";
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest(TAPPABLE);
  if (!el || e.button > 0) return;
  if (e.pointerType === "touch" && navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
  if (calmMotion.matches) return;
  const box = el.getBoundingClientRect();
  const size = Math.max(box.width, box.height) * 2.4;

  glow.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - box.left}px;top:${e.clientY - box.top}px`;
  el.appendChild(glow);
  glow.addEventListener("animationend", () => glow.remove());

}, { passive: true });

// Videos: start muted when on screen, pause when off screen. Only a real autoplay block (NotAllowedError) shows the
// big play button; an AbortError just means a pause() or re-render interrupted play() and is not a failure.
// Touch screens: previews zoom gently once they are in the middle of the screen; tapping a keyword highlights it.
const touch = window.matchMedia("(hover: none)").matches;
let watcher;
function tryPlay(box, video) {
  const p = video.play();
  if (p) p.catch((err) => { if (err.name === "NotAllowedError") box.querySelector(".fallback").hidden = false; });

      if (touch) box.classList.toggle("inview", e.intersectionRatio >= 0.6);
      if (!video) continue;
      if (e.intersectionRatio >= 0.35 && !video.dataset.userPaused) tryPlay(box, video);
      else if (!e.isIntersecting) video.pause();
    }
  }, { threshold: [0, 0.35, 0.6] }) : null;
  root.querySelectorAll(".media").forEach((box) => {
    if (watcher) watcher.observe(box);
    const video = box.querySelector("video");
    if (!video) return;
    const big = box.querySelector(".fallback"), ctl = box.querySelector(".vctl"), err = box.querySelector(".verr"), snd = box.querySelector(".vsnd");
    // Sound is always off at start (browsers only autoplay muted); the visitor turns it on with one tap.
    snd.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      video.muted = !video.muted;
      snd.setAttribute("aria-pressed", String(!video.muted));
      snd.setAttribute("aria-label", video.muted ? t("soundOn") : t("soundOff"));
      snd.innerHTML = (video.muted ? ICON.muted : ICON.sound) + `<span>${t("tapSound")}</span>`;
      if (!video.muted && video.paused) { delete video.dataset.userPaused; video.play().catch(() => {}); }
    };
    video.muted = true; // iOS only autoplays when the property is set, not just the attribute
    video.defaultMuted = true;
    const showState = () => {
      const playing = !video.paused;
      ctl.innerHTML = playing ? ICON.pause : ICON.play;
      ctl.setAttribute("aria-label", playing ? t("pauseVideo") : t("playVideo"));
    };
    video.addEventListener("playing", () => { big.hidden = true; err.hidden = true; showState(); });
    video.addEventListener("pause", showState);
    video.addEventListener("error", () => { err.hidden = false; big.hidden = true; });
    big.onclick = (e) => { e.preventDefault(); e.stopPropagation(); delete video.dataset.userPaused; video.play().catch(() => {}); };
    ctl.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      if (video.paused) { delete video.dataset.userPaused; video.play().catch(() => { big.hidden = false; }); }
      else { video.dataset.userPaused = "1"; video.pause(); }
    };
    if (!watcher) tryPlay(box, video);
  });
  root.querySelectorAll(".kw").forEach((k) => (k.onclick = () => k.classList.toggle("on")));
}

// Language menu
const menu = document.getElementById("lang-menu");
const langBtn = document.getElementById("lang-btn");
function drawMenu() {
  menu.innerHTML = `<p>Language · اللغة · Langue</p>` + LANGS.map(([code, name]) =>
    `<button type="button" role="menuitemradio" aria-checked="${code === lang}" data-lang="${code}" lang="${code}">${name}${code === lang ? '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7F3D" stroke-width="2.4"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ""}</button>`).join("");
  menu.querySelectorAll("[data-lang]").forEach((b) => (b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("gs-lang", lang); } catch (e) {}
    toggleMenu(false);
    render(false);
  }));
}
function toggleMenu(open) {
  menu.hidden = !open;
  langBtn.setAttribute("aria-expanded", String(open));
  if (open) { drawMenu(); menu.querySelector("[aria-checked='true']").focus(); }
}
langBtn.onclick = () => toggleMenu(menu.hidden);
document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".float")) toggleMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { toggleMenu(false); langBtn.focus(); } });

window.addEventListener("hashchange", () => { tab = "video"; render(); });
render();
</script>

<style>
/* Layout: phone = one column; tablet (640+) = 2-col categories, 3-col products; desktop (1024+) = hero text + video side by side,
   4-col categories, category/product pages split into text and media columns. Sticky header + category chips; language + WhatsApp bottom-right.
   Single light brand look by choice: navy + gold on white. Video-first previews; keywords turn brand blue; previews zoom slowly. */
:root {
  --blue: #2E3A8C;
  --navy: #282C55;
  --navy-deep: #262948;
  --gold: #F1C854;
  --gold-ink: #85601F;
  --paper: #FFFFFF;
  --mist: #F5F5F7;
  --ink: #1D1D1F;
  --muted: #62626A;
  --line: #E3E3E8;
  --ph: #ECECF1;
  --ph-line: #B9B9C4;
  --wa: #0B7F3D;
  --wa-hover: #096B33;
  --note: #FFF6DA;
  --note-ink: #5E4510;
  --display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --arabic: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); }
html:is([lang="ar"], [lang="fa"]) body, html:is([lang="ar"], [lang="fa"]) .display { font-family: var(--arabic); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.display { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; }

/* Header + chips */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar { height: 56px; display: flex; align-items: center; gap: 10px; }
.mark { width: 32px; height: 32px; flex: none; display: block; }
.brand { font: 700 16px var(--display); color: var(--navy); text-decoration: none; display: flex; align-items: center; gap: 10px; }
.back { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--mist); display: grid; place-items: center; flex: none; }
/* Header (2026-11-01): language and Contact Us top-right; the email sits in the bar from 720 px, in a strip above it on phones */
.topline { background: var(--navy-deep); }
.topline .wrap { height: 36px; display: flex; align-items: center; justify-content: center; }
.mail { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
.topline .mail { min-height: 36px; color: #FFFFFF; }
.topline .mail svg { color: var(--gold); }
.mail-bar { display: none; min-height: 40px; padding-inline: 4px; color: var(--navy); font-size: 14px; }
.mail-bar svg { color: var(--gold-ink); }
.bar-nav { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.brand { min-width: 0; }
.brand-name { white-space: nowrap; }
.lang-wrap { position: relative; flex: none; }
.contact { flex: none; height: 40px; padding-inline: 12px; border-radius: 20px; background: var(--navy); color: #FFFFFF; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
html:is([lang="ar"], [lang="fa"]) .contact, html:is([lang="ar"], [lang="fa"]) .lang-btn { font-family: var(--arabic); }
#lang-name { display: none; }
.lang-chev { display: none; color: var(--muted); transition: transform .2s ease; }
.lang-btn[aria-expanded="true"] .lang-chev { transform: rotate(180deg); }
.phones.flash a { animation: contact-flash 1.6s ease; }
@keyframes contact-flash { 30% { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(241, 200, 84, .35); } }
@media (prefers-reduced-motion: reduce) { .phones.flash a { animation: none; } }
@media (max-width: 379px) { .brand-name { display: none; } }
@media (max-width: 419px) { .bar-nav .back + .brand .brand-name { display: none; } }
@media (min-width: 720px) {
  .topline { display: none; }
  .mail-bar { display: inline-flex; }
  .contact { padding-inline: 16px; font-size: 14px; }
  #lang-code { display: none; }
  #lang-name, .lang-chev { display: inline; }
}
@media (hover: hover) { .contact:hover { background: var(--navy-deep); } .mail-bar:hover span { text-decoration: underline; text-underline-offset: 3px; } .lang-btn:hover { border-color: var(--navy); } }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 8px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding-inline: 14px; border-radius: 18px; background: var(--mist); color: var(--ink); display: flex; align-items: center; font-size: 14px; text-decoration: none; white-space: nowrap; }
.chip[aria-current="page"] { background: var(--navy); color: #FFFFFF; font-weight: 600; }

/* Placeholders */
.ph { background: var(--ph); border: 1px dashed var(--ph-line); border-radius: 12px; color: var(--muted); font-size: 12px; display: grid; place-items: center; text-align: center; padding: 8px; }
.ph.video { width: min(240px, 70%); aspect-ratio: 9 / 16; margin-inline: auto; border-radius: 18px; gap: 10px; align-content: center; }
.play { width: 56px; height: 56px; border-radius: 28px; background: rgba(38, 41, 72, 0.88); display: grid; place-items: center; margin-inline: auto; }

/* Hero */
.hero { background: #3A3E66; color: #FFFFFF; position: relative; }
.hero .wrap { position: relative; padding-block: 140px 24px; display: grid; gap: 16px; }
.hero-copy { position: relative; display: grid; gap: 16px; }
.eyebrow { margin: 0; color: var(--gold); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.hero h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); line-height: 1.08; font-weight: 800; }
.hero p.sub { margin: 0; font-size: 17px; color: #E4E5F0; }
.btn-gold { height: 52px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ink); font-weight: 700; font-size: 16px; }

/* Sections */
.section { padding-block: 28px; display: grid; gap: 12px; }
.section h2 { margin: 0; color: var(--navy); font-size: 26px; line-height: 1.15; font-weight: 800; }
.lead { margin: 0; color: var(--muted); font-size: 15px; }
.group-label { margin: 10px 0 0; color: var(--gold-ink); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.cat { min-height: 104px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); background: var(--paper); }
.cat:hover { border-color: var(--navy); }
.cat > .media { flex: 0 0 96px; height: 96px; }
.cat-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.cat-title { font: 700 17px var(--display); color: var(--navy); }
html:is([lang="ar"], [lang="fa"]) .cat-title { font-family: var(--arabic); }
.cat-line { font-size: 13px; color: var(--muted); }
.pill { justify-self: start; padding: 2px 9px; border-radius: 10px; background: var(--mist); font-size: 12px; font-weight: 600; }
.chev { flex: none; color: var(--gold-ink); }
[dir="rtl"] .chev, [dir="rtl"] .back svg { transform: scaleX(-1); }

/* Category + product pages */
.page-head { padding-block: 20px 4px; display: grid; gap: 12px; }
.page-head h1 { margin: 0; color: var(--navy); font-size: clamp(28px, 7.5vw, 40px); line-height: 1.1; font-weight: 800; }
.intro { margin: 0; font-size: 17px; }
.crumb { font-size: 14px; font-weight: 500; text-decoration: none; justify-self: start; }
.facts { margin: 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; font-size: 15px; font-weight: 500; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--mist); font-size: 13px; line-height: 1.45; }
.note b { color: var(--navy); }
.small { margin: 0; color: var(--muted); font-size: 13px; }
.draft { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--note); color: var(--note-ink); font-size: 12.5px; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type { padding: 10px 6px; border-radius: 12px; border: 0; background: var(--mist); display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-align: center; }
.type svg { color: var(--navy); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 8px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; text-decoration: none; color: var(--ink); min-width: 0; }
.tile:hover { border-color: var(--navy); }
.tile-brand { color: var(--gold-ink); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.tile-name { font: 700 15px/1.25 var(--display); color: var(--navy); }
.tile-blurb { font-size: 13px; line-height: 1.35; }
.tile-meta { font-size: 12px; color: var(--muted); }
.tile-uses { font-size: 12px; font-weight: 600; color: var(--navy); }
.tile-later { font-size: 12px; color: var(--muted); font-style: italic; }
.pkg { align-self: flex-start; padding: 2px 9px; border-radius: 10px; background: #FBEFC6; color: var(--note-ink); font-size: 12px; font-weight: 600; }
.subgroup h2 { font-size: 20px; }
.ask { justify-self: center; height: 48px; padding-inline: 22px; border-radius: 24px; border: 1px solid #C9CAD9; color: var(--navy); display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; }
.seg { justify-self: center; padding: 4px; border-radius: 22px; background: var(--mist); display: flex; gap: 4px; }
.seg button { height: 38px; padding-inline: 24px; border: 0; border-radius: 19px; background: transparent; font-size: 14px; font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--navy); color: #FFFFFF; font-weight: 600; }
.ph.square { aspect-ratio: 1; width: 100%; max-width: 420px; margin-inline: auto; }
.btn-wa { height: 54px; border-radius: 27px; background: var(--wa); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
.btn-wa:hover { background: var(--wa-hover); }
.row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.row .tile { flex: 0 0 150px; }

footer { background: var(--mist); margin-top: 24px; }
footer .wrap { padding-block: 24px 120px; display: grid; gap: 12px; }
.phones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phones div { padding: 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.phones span { display: block; color: var(--muted); font-size: 12px; }
.phones b { font-size: 14px; user-select: all; }
.phones a { padding: 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); transition: border-color .25s ease, background-color .25s ease, transform .18s cubic-bezier(.2, .7, .2, 1); }
.phones a:hover { border-color: var(--wa); background: #F2FAF5; }
.phones a:active { transform: scale(.97); }
.phones a span { display: block; color: var(--muted); font-size: 12px; }
.phones .wa-dot { width: 32px; height: 32px; border-radius: 16px; background: var(--wa); display: grid; place-items: center; flex: none; }
.phones .wa-dot svg { width: 17px; height: 17px; }
.phones .num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
@media (max-width: 419px) { .phones { grid-template-columns: 1fr; } }
.address { display: flex; align-items: center; gap: 10px; }
/* The flag never mirrors in Arabic; a hairline keeps the white stripe visible on light backgrounds */
.uae-flag { flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15); }
.cat-head { padding-block: 20px 0; }
.cat-head .intro { max-width: 60ch; }
.cat-products { padding-block: 18px 6px; display: grid; gap: 12px; scroll-margin-top: 120px; }
.cat-products.subgroup { padding-top: 22px; }
.cat-products.subgroup h2 { margin: 0; font-size: 20px; color: var(--navy); }
.a-info .headline { margin: -4px 0 0; font-size: 17px; font-weight: 700; color: var(--gold-ink); }
.terms { grid-column: 1 / -1; margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.terms h2 { margin: 0; font-size: 18px; color: var(--navy); }
.terms dl { margin: 0; display: grid; gap: 12px; }
.terms dl div { display: grid; gap: 2px; }
.terms dt { font-size: 14px; font-weight: 700; color: var(--navy); }
.terms dd { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.partners { display: grid; gap: 8px; }
.partners p { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.partner-logos { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.partner-logos img { height: 40px; width: auto; border-radius: 6px; display: block; }
@media (min-width: 640px) { .terms dl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; } }
@media (min-width: 1024px) { .terms dl { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Floating language + WhatsApp: always bottom-right */
.float { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; direction: ltr; }
.lang-btn { height: 40px; padding-inline: 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--paper); color: var(--navy); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.wa-fab { width: 64px; height: 64px; border-radius: 32px; background: var(--wa); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
/* WhatsApp language chooser: bottom sheet on phones, centred card on larger screens */
.wa-dialog { width: 100%; max-width: 100%; margin: auto 0 0; padding: 0; border: 0; border-radius: 20px 20px 0 0; background: var(--paper); color: var(--ink); }
.wa-dialog::backdrop { background: rgba(20, 22, 45, 0.55); }
.wa-sheet { padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.wa-head { display: flex; align-items: center; gap: 10px; }
.wa-head h2 { margin: 0; flex: 1; font-size: 20px; color: var(--navy); }

.wa-close:hover { background: #E2E3EE; }
.wa-product { margin: 0; font-weight: 600; color: var(--gold-ink); }
.wa-sub { margin: 0; color: var(--muted); font-size: 14px; }
.wa-options { display: grid; gap: 8px; margin-top: 4px; }
.wa-opt { min-height: 60px; padding: 10px 12px 10px 16px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); transition: border-color .25s ease, background-color .25s ease; }
.wa-opt[aria-current="true"] { border-color: var(--navy); }
.wa-opt:hover, .wa-opt:active { border-color: var(--wa); background: #F2FAF5; }
.wa-opt-text { flex: 1; display: grid; gap: 2px; }
.wa-opt-name { font-size: 17px; font-weight: 600; color: var(--navy); }

.wa-opt[lang="ar"] .wa-opt-name, .wa-opt[lang="ar"] .wa-opt-note { font-family: var(--arabic); }
.wa-opt-icon { width: 40px; height: 40px; border-radius: 20px; background: var(--wa); display: grid; place-items: center; flex: none; }
@media (min-width: 640px) {
  .wa-dialog { max-width: 420px; margin: auto; border-radius: 20px; }

/* Find the right detector page */
.finder { display: grid; gap: 14px; padding-block: 18px 36px; max-width: 820px; }
.step { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); display: grid; gap: 12px; min-width: 0; }
.step h2 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 18px/1.3 var(--display); color: var(--navy); }
html:is([lang="ar"], [lang="fa"]) .step h2 { font-family: var(--arabic); }
.step-num { flex: none; width: 28px; height: 28px; border-radius: 14px; background: var(--navy); color: #FFFFFF; display: grid; place-items: center; font: 700 14px var(--body); }
.step .hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt-card { min-height: 56px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); display: flex; align-items: center; gap: 10px; text-align: start; font-size: 15px; font-weight: 600; cursor: pointer; transition: border-color .2s ease, background-color .2s ease, transform .18s cubic-bezier(.2, .7, .2, 1); }
.opt-card .tick { flex: none; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9CAD9; display: grid; place-items: center; transition: background-color .2s ease, border-color .2s ease; }
.opt-card .tick svg { opacity: 0; transition: opacity .2s ease; }
.opt-card[aria-pressed="true"] { border-color: var(--navy); background: #F3F4FA; color: var(--navy); }
.opt-card[aria-pressed="true"] .tick { background: var(--navy); border-color: var(--navy); }
.opt-card[aria-pressed="true"] .tick svg { opacity: 1; }
.opt-card:active { transform: scale(.97); }
@media (hover: hover) { .opt-card:hover { border-color: var(--blue); } }
.finder-send { width: 100%; height: 56px; border: 0; cursor: pointer; font: 600 17px var(--body); }
html:is([lang="ar"], [lang="fa"]) .finder-send { font-family: var(--arabic); }
@media (min-width: 640px) { .opt-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .step { padding: 20px; } }
@media (min-width: 1024px) { .opt-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* Image placeholders: fixed shape per area, empty until an image is added (IMAGES list) */
.slot { position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: var(--ar); overflow: hidden; border-radius: 12px; background: var(--ph); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1), opacity .4s ease; }
.slot-product { background: #FFFFFF; }
.slot-empty { position: absolute; inset: 0; border: 1px dashed var(--ph-line); border-radius: inherit; display: grid; place-content: center; justify-items: center; gap: 2px; padding: 6px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.3; }
.slot-empty small { font-size: 11px; font-weight: 500; }
.tile:hover .slot img, .cat:hover .slot img, .pic-card:hover .slot img, .slot-main:hover img { transform: scale(1.05); }
.only-wide { display: none !important; }
@media (min-width: 768px) { .only-wide { display: block !important; } .only-narrow { display: none !important; } }
/* Hero: banner behind the text (1920 x 700 on desktop, 900 x 1200 on phones) */
.hero { position: relative; overflow: hidden; display: grid; align-items: end; min-height: calc(100vw * 1200 / 900); }
.hero-banner { position: absolute; inset: 0; }
.hero-banner .slot, .hero-pic, .hero-pic img { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }
.hero-banner .slot { background: #3A3E66; }
.hero-pic img { object-position: 80% 50%; } /* the person stands on the right; keep them in view when narrow screens crop the sides */
[dir="rtl"] .hero-pic img { transform: scaleX(-1); } /* Arabic text sits on the right, so the person moves to the left */
.hero-banner .slot-empty { border-color: #6C70A0; color: #D5D7E8; place-content: start end; justify-items: end; padding: 14px; }

  if (e.pointerType === "touch" && navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
  if (calmMotion.matches) return;
  const box = el.getBoundingClientRect();
  const size = Math.max(box.width, box.height) * 2.4;
  const glow = document.createElement("span");
  glow.className = "ripple";

  glow.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - box.left}px;top:${e.clientY - box.top}px`;
  el.appendChild(glow);
  glow.addEventListener("animationend", () => glow.remove());
  setTimeout(() => glow.remove(), 900); // also when the browser skips the animation (background tab)
}, { passive: true });

const PHONE_FIRST = ["ae", "sa", "om", "qa", "kw", "bh", "eg", "sd", "zw", "tz", "zm", "ml", "bf", "ph", "in", "pk", "us", "gb"];

let phoneLib = null;
function loadPhoneLib() {
  if (window.intlTelInput) return Promise.resolve();
  return phoneLib || (phoneLib = new Promise((done) => {
    const js = document.createElement("script");
    js.src = "https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.4/dist/js/intlTelInputWithUtils.min.js";
    js.onload = js.onerror = done;
    document.head.appendChild(js);
  }));
}
// Turns a plain phone field into the full one once the library is there, keeping what was typed.
function upgradePhone(input, saved, use) {
  loadPhoneLib().then(() => { if (window.intlTelInput && input.isConnected && !input.closest(".iti")) use(makePhone(input, input.value ? { number: input.value, iso2: saved && saved.iso2 } : saved)); });
}
// Clear any stray page selection left after picking a country (e.g. a double-click on the list)
function clearStraySelection() {
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && !(sel.anchorNode && sel.anchorNode.closest && sel.anchorNode.closest("input"))) sel.removeAllRanges();
}
// One phone field setup for every form: flags, dialing codes, search, per-country checks.
function makePhone(input, saved) {
  if (!window.intlTelInput) return null; // library blocked: plain field, simple check in checkPhoneField
  const field = window.intlTelInput(input, {
    initialCountry: (saved && saved.iso2) || "ae",
    countryOrder: PHONE_FIRST,
    countrySearch: true,
    separateDialCode: true,
    strictMode: true,
    countrySelectorMode: "DROPDOWN", // stays inside the panel or page on phones too
    countryNameLocale: lang,
    uiTranslations: { searchPlaceholder: t("searchCountry") }
  });
  if (saved && saved.number) field.setNumber(saved.number);
  input.addEventListener("countrychange", () => setTimeout(clearStraySelection, 0));
  return field;
}
function savePhone(field) {
  if (!field) return null;
  const c = field.getSelectedCountry();
  return { number: field.getNumber(), iso2: c ? c.iso2 : "ae" };
}
function checkPhoneField(field, input) {
  const raw = input.value.trim();
  if (field) {
    const country = field.getSelectedCountry();
    if (!raw || !field.isValidNumber()) return { error: country ? t("errPhoneFor")(country.name) : t("errPhone") };
    return { number: field.getNumber(window.intlTelInput.NUMBER_FORMAT.INTERNATIONAL) };
  }
  // Fallback when the phone library could not load: must start with + and the country code
  return /^\+\d[\d\s\-()]{6,18}$/.test(raw) ? { number: raw } : { error: t("errPhone") };
}
function setupPhone() {
  const saved = savePhone(phoneField);

  phoneField = makePhone(document.getElementById("q-phone"), saved);
  if (!phoneField) upgradePhone(document.getElementById("q-phone"), saved, (f) => { phoneField = f; });
}

function closeQuote() {
  if (!quoteDialog.open || quoteDialog.classList.contains("closing")) return;
  const finish = () => { quoteDialog.classList.remove("closing"); if (typeof quoteDialog.close === "function") quoteDialog.close(); else quoteDialog.removeAttribute("open"); };
  if (calmMotion.matches) return finish();
  quoteDialog.classList.add("closing");
  setTimeout(finish, 210);
}

function showError(id, message) {
  const input = document.getElementById(id), err = document.getElementById(id + "-err");
  err.textContent = message; err.hidden = !message;
  if (message) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");

function checkQuote() {
  const language = document.getElementById("q-lang").value;

  const phone = checkPhone();
  const errors = {

    "q-email": /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : t("errEmail"),

}

function depthRange(items) {

}

const SIZES = { category: "(min-width: 1024px) 300px, 104px", product: "(min-width: 1024px) 300px, 50vw", productMain: "(min-width: 1024px) 460px, 92vw", showroom: "(min-width: 1152px) 1088px, calc(100vw - 32px)", subcategory: "(min-width: 1024px) 360px, 33vw" };
function srcset(src, sizes) {
  const m = /-(\d+)w\.webp$/.exec(src);
  if (!m || !sizes) return "";
  const half = m[1] / 2;
  return ` srcset="${src.slice(0, m.index)}-${half}w.webp ${half}w, ${src} ${m[1]}w" sizes="${sizes}"`;
}
// An image area with a fixed shape: shows the uploaded image, or an empty box with its size until there is one.
function slot(kind, src, alt = "", extra = "") {
  const [w, h, fit, label] = SLOTS[kind];
  return `<span class="slot slot-${kind}${extra}" style="--ar: ${w} / ${h}">${src
    ? `<img src="${src}"${srcset(src, extra.includes("slot-main") ? SIZES.productMain : SIZES[kind])} alt="${alt}" width="${w}" height="${h}" loading="lazy" decoding="async" style="object-fit: ${fit}">`
    : `<span class="slot-empty"><span class="slot-name">${label}</span><small>${w} × ${h} px</small></span>`}</span>`;
}

}

function placeholder(shape, label, isPhoto = false) {
  const small = shape.includes("sm");
  return `<div class="media ${shape}${isPhoto ? " ph-photo" : ""}"><div class="media-inner">${isPhoto ? `<span>${label}</span>` : ICON.play}${small ? "" : `<span>${label}</span><span class="tagline">${t("autoplay")}</span>`}</div></div>`;
}

// A real video: muted, looping, inline. setupMedia() starts it when on screen, with a play/pause button,
// a big play button if the browser blocks autoplay, and a message if the file fails to load.
function media(key, shape, label, preload = "auto") {
  const v = VIDEOS[key];
  if (!v) return placeholder(shape, label);
  return `<div class="media ${shape}">
    <video src="${v.src}"${v.poster ? ` data-poster="${v.poster}"` : ""} muted autoplay loop playsinline preload="${preload}" aria-label="${label}"></video>
    <button type="button" class="fallback" hidden aria-label="${t("playVideo")}">${ICON.play}</button>
    <button type="button" class="vctl" aria-label="${t("pauseVideo")}">${ICON.pause}</button>
    <button type="button" class="vsnd" aria-pressed="false" aria-label="${t("soundOn")}">${ICON.muted}<span>${t("tapSound")}</span></button>
    <p class="verr" hidden>${t("videoError")}</p>
  </div>`;
}

function tile(p, cat) {
  const blurb = p.blurb ? `<span class="tile-blurb"><bdi>${p.blurb}</bdi></span>` : `<span class="tile-later">${t("later")}</span>`;
  const depth = SHOW_DEPTH && cat.depth && p.depth ? `<span class="tile-meta">${cat.depth === "neutral" ? t("states") + " " + p.depth : t("depth") + ": " + p.depth}</span>` : "";
  return `<a class="tile" href="#p-${p.key}">
    ${slot("product", IMAGES.products[p.key], p.name)}
    ${p.brand ? `<span class="tile-brand">${p.brand}</span>` : ""}

// Find the right detector: a 3-step wizard (user request 2026-10-30).

const FINDER_FIND = [

  ["utilities", { en: "Utilities", fr: "Réseaux enterrés", ar: "خطوط المرافق", fa: "تأسیسات زیرزمینی" }],

];
// Preferred language: value, label, name in the message. Each one opens its own WhatsApp line (WA_LINES).
const FINDER_LANGS = [["en", "English", "English"], ["ar", "العربية (Arabic)", "Arabic"], ["fr", "Français (French)", "French"]];
const finder = { find: "", env: "", name: "", email: "", lang: "", phone: null, saved: null, lastStep: 1, advancing: false, sending: false };
const esc = (v) => String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const checkMark = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#262948" stroke-width="3.5"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function renderFinder(step) {
  const dir = step >= finder.lastStep ? "fwd" : "back";
  finder.lastStep = step;
  const head = (h) => `<a class="crumb" href="#home">← ${t("all")}</a><p class="wiz-eyebrow">${t("finderTitle")}</p>${finderProgress(step)}<h1 class="display" id="wiz-q">${h}</h1>`;

function setupFinder(root) {
  const wizard = root.querySelector(".wizard");
  if (!wizard) return;
  // Steps 1 and 2: tapping a card saves the answer, shows the tick briefly, then opens the next step.
  // A second tap during that moment is ignored, so one tap never skips two steps.
  wizard.querySelectorAll(".pic-card").forEach((card) => (card.onclick = () => {
    if (finder.advancing) return;
    const q = card.dataset.q;
    finder[q] = card.dataset.v;
    wizard.querySelectorAll(".pic-card").forEach((c) => c.setAttribute("aria-checked", String(c === card)));
    finder.advancing = true;
    setTimeout(() => { finder.advancing = false; location.hash = q === "find" ? "finder-2" : "finder-3"; }, calmMotion.matches ? 0 : 280);
  }));
  const form = root.querySelector("#finder-form");
  if (!form) return;
  // Step 3: contact details. Typed values survive a language switch or going back and forth.
  [["f-name", "name"], ["f-email", "email"]].forEach(([id, key]) =>
    document.getElementById(id).addEventListener("input", (e) => { finder[key] = e.target.value; if (e.target.getAttribute("aria-invalid")) showError(id, ""); }));
  const select = document.getElementById("f-lang");
  select.addEventListener("change", () => { finder.lang = select.value; showError("f-lang", ""); });
  const phoneInput = document.getElementById("f-phone");
  finder.phone = makePhone(phoneInput, finder.saved);
  if (!finder.phone) upgradePhone(phoneInput, finder.saved, (f) => { finder.phone = f; });
  const remember = () => { finder.saved = savePhone(finder.phone); if (phoneInput.getAttribute("aria-invalid")) showError("f-phone", ""); };
  phoneInput.addEventListener("input", remember);
  phoneInput.addEventListener("countrychange", remember);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const phone = checkPhoneField(finder.phone, phoneInput);
    const errors = {
      "f-name": name.length >= 2 ? "" : t("errName"),
      "f-email": /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : t("errEmail"),
      "f-phone": phone.error || "",
      "f-lang": finder.lang ? "" : t("errLang")
    };
    Object.entries(errors).forEach(([id, msg]) => showError(id, msg));
    const firstBad = Object.keys(errors).find((id) => errors[id]);
    if (firstBad) { document.getElementById(firstBad).focus(); return; }

    const en = (list, v) => list.find((o) => o[0] === v)[1].en;
    const langName = FINDER_LANGS.find(([v]) => v === finder.lang)[2];
    // Format requested by the user (2026-10-30, wizard version)
    const message = [
      "DETECTOR RECOMMENDATION REQUEST",
      `Target: ${en(FINDER_FIND, finder.find)}`,
      `Terrain: ${en(FINDER_ENV, finder.env)}`,
      `CUSTOMER DETAILS: Name: ${name} Email: ${email} Contact No: ${phone.number} Preferred Language: ${langName}`
    ].join("\n") + (CAMPAIGN ? `\nRef: ${CAMPAIGN}` : "");
    // One tap = one WhatsApp window: the button pauses for a few seconds after sending
    if (finder.sending) return;
    finder.sending = true;
    const sendBtn = form.querySelector(".finder-send");
    sendBtn.disabled = true; sendBtn.setAttribute("aria-busy", "true"); sendBtn.innerHTML = ICON.wa + t("opening");
    setTimeout(() => {
      finder.sending = false;
      if (document.body.contains(sendBtn)) { sendBtn.disabled = false; sendBtn.removeAttribute("aria-busy"); sendBtn.innerHTML = ICON.wa + t("getRec"); }
    }, 4000);
    const link = waLink(finder.lang, message); // English, Arabic or French line
    try { (window.dataLayer = window.dataLayer || []).push({ event: "recommendation_request", target: finder.find, terrain: finder.env, chat_language: finder.lang, campaign: CAMPAIGN }); } catch (err) {}
    const tab = window.open(link, "_blank");
    if (tab) tab.opener = null; else location.href = link; // pop-up blocked: open WhatsApp in this tab
  });
}

let tab = "auto"; // product media tab: "auto" opens the video, or the photo when there is no video yet
function route() {
  const fm = /^#finder(?:-([123]))?$/.exec(location.hash);
  if (fm) {
    let step = Number(fm[1] || 1);
    if (step >= 2 && !finder.find) step = 1;
    if (step === 3 && !finder.env) step = 2;
    return { view: "finder", step };
  }
  const h = location.hash.slice(1);
  if (h.startsWith("p-")) {
    const found = findProduct(h.slice(2));
    if (found) return { view: "product", ...found };
  }
  const cat = catById(h);
  if (cat) return { view: "cat", cat };
  return { view: "home" };
}

function render(scrollTop = true) {
  const r = route();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" || lang === "fa" ? "rtl" : "ltr";
  renderBar(r);
  const view = document.getElementById("view");
  if (finder.phone) { finder.saved = savePhone(finder.phone); try { finder.phone.destroy(); } catch (e) {} finder.phone = null; }
  view.innerHTML = r.view === "finder" ? renderFinder(r.step) : r.view === "product" ? renderProduct(r, tab) : r.view === "cat" ? renderCat(r.cat) : renderHome();
  document.getElementById("wa-fab").href = wa(t("msgGeneral"));
  const shownLang = LANGS.find((l) => l[0] === lang);
  document.getElementById("lang-code").textContent = shownLang[2];
  document.getElementById("lang-name").textContent = shownLang[1];
  document.getElementById("lang-btn").setAttribute("aria-label", t("lang") + ": " + shownLang[1]);
  document.getElementById("contact-link").textContent = t("contact");
  renderTerms();
  renderFooterPhones();
  renderBrands();
  document.getElementById("sample-note").textContent = (t("draft") ? t("draft") + " " : "") + "Sample for approval. Grey boxes are photo and video placeholders.";
  const cta = document.getElementById("cta");
  if (cta) cta.onclick = () => { location.hash = "finder-1"; }; // "Find my detector" opens the 3-step wizard
  if (r.view === "finder" || (r.view === "product" && QUOTE_CATS.includes(r.cat.id))) loadPhoneLib(); // ready before the form opens
  setupFinder(view);
  view.querySelectorAll("[data-jump]").forEach((b) => (b.onclick = () => document.getElementById(b.dataset.jump).scrollIntoView()));
  view.querySelectorAll("[data-media]").forEach((b) => (b.onclick = () => { tab = b.dataset.media; render(false); }));

  if (chip) chip.parentElement.scrollLeft = chip.offsetLeft - chip.parentElement.clientWidth / 2 + chip.clientWidth / 2;
  if (scrollTop) {
    window.scrollTo(0, 0);
    view.classList.remove("enter");
    void view.offsetWidth; // restart the entry animation
    view.classList.add("enter");
  }
}

// Videos: start muted when on screen, pause when off screen. Only a real autoplay block (NotAllowedError) shows the
// big play button; an AbortError just means a pause() or re-render interrupted play() and is not a failure.
// Touch screens: previews zoom gently once they are in the middle of the screen; tapping a keyword highlights it.
const touch = window.matchMedia("(hover: none)").matches;
let watcher;
function tryPlay(box, video) {
  const p = video.play();
  if (p) p.catch((err) => { if (err.name === "NotAllowedError") box.querySelector(".fallback").hidden = false; });
}
function setupMedia(root) {
  if (watcher) watcher.disconnect();
  watcher = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
    for (const e of entries) {
      const box = e.target, video = box.querySelector("video");
      if (touch) box.classList.toggle("inview", e.intersectionRatio >= 0.6);
      if (!video) continue;
      if (e.intersectionRatio >= 0.35 && !video.dataset.userPaused) tryPlay(box, video);
      else if (!e.isIntersecting) video.pause();
    }
  }, { threshold: [0, 0.35, 0.6] }) : null;
  const nearby = "IntersectionObserver" in window ? new IntersectionObserver((entries, o) => {
    for (const e of entries) if (e.isIntersecting) { const v = e.target.querySelector("video"); v.poster = v.dataset.poster; o.unobserve(e.target); }
  }, { rootMargin: "800px 0px" }) : null;
  root.querySelectorAll(".media").forEach((box) => {
    if (watcher) watcher.observe(box);
    const video = box.querySelector("video");
    if (!video) return;
    if (video.dataset.poster) { if (nearby) nearby.observe(box); else video.poster = video.dataset.poster; }
    const big = box.querySelector(".fallback"), ctl = box.querySelector(".vctl"), err = box.querySelector(".verr"), snd = box.querySelector(".vsnd");
    // Sound is always off at start (browsers only autoplay muted); the visitor turns it on with one tap.
    snd.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      video.muted = !video.muted;
      snd.setAttribute("aria-pressed", String(!video.muted));
      snd.setAttribute("aria-label", video.muted ? t("soundOn") : t("soundOff"));
      snd.innerHTML = (video.muted ? ICON.muted : ICON.sound) + `<span>${t("tapSound")}</span>`;
      if (!video.muted && video.paused) { delete video.dataset.userPaused; video.play().catch(() => {}); }
    };
    video.muted = true; // iOS only autoplays when the property is set, not just the attribute
    video.defaultMuted = true;
    const showState = () => {
      const playing = !video.paused;
      ctl.innerHTML = playing ? ICON.pause : ICON.play;
      ctl.setAttribute("aria-label", playing ? t("pauseVideo") : t("playVideo"));
    };
    video.addEventListener("playing", () => { big.hidden = true; err.hidden = true; showState(); });
    video.addEventListener("pause", showState);
    video.addEventListener("error", () => { err.hidden = false; big.hidden = true; });
    big.onclick = (e) => { e.preventDefault(); e.stopPropagation(); delete video.dataset.userPaused; video.play().catch(() => {}); };
    ctl.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      if (video.paused) { delete video.dataset.userPaused; video.play().catch(() => { big.hidden = false; }); }
      else { video.dataset.userPaused = "1"; video.pause(); }
    };
    if (!watcher) tryPlay(box, video);
  });
  root.querySelectorAll(".kw").forEach((k) => (k.onclick = () => k.classList.toggle("on")));
}

// Motion. Scroll reveals and the header shadow use IntersectionObserver (no scroll listeners); the hero parallax
// only listens while a desktop mouse moves over it, one frame at a time. Reduced motion skips all of it.
const REVEAL = ".section > h2, .cat, .tile, .promo .media, .types .type, footer .phones a";
const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
let revealer, heroWatch;
function setupMotion(view) {
  // Photos: skeleton sweep until loaded, then fade in
  view.querySelectorAll(".slot img").forEach((img) => {
    if (img.complete && img.naturalWidth) return;
    const box = img.parentElement;
    box.classList.add("loading");
    const done = () => box.classList.remove("loading");
    img.addEventListener("load", done, { once: true });
    img.addEventListener("error", done, { once: true });
  });
  if (revealer) revealer.disconnect();
  if (heroWatch) heroWatch.disconnect();
  if (calmMotion.matches || !("IntersectionObserver" in window)) return;
  revealer = new IntersectionObserver((entries) => {
    let i = 0;
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      e.target.style.setProperty("--d", Math.min(i++, 6) * 70 + "ms");
      e.target.classList.add("in");
      revealer.unobserve(e.target);
    }
  }, { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(REVEAL).forEach((el) => { el.classList.add("rv"); revealer.observe(el); });
  const hero = view.querySelector(".hero"), pic = hero && hero.querySelector(".hero-pic");
  if (!pic || !finePointer.matches) return;
  heroWatch = new IntersectionObserver(([e]) => hero.classList.toggle("idle", !e.isIntersecting)); // pause the gold light off screen
  heroWatch.observe(hero);
  let frame = 0, x = 0, y = 0;
  hero.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const b = hero.getBoundingClientRect();
    x = (e.clientX - b.left) / b.width - 0.5;
    y = (e.clientY - b.top) / b.height - 0.5;
    if (!frame) frame = requestAnimationFrame(() => {
      frame = 0;
      pic.style.setProperty("--hx", (-x * 14).toFixed(1) + "px");
      pic.style.setProperty("--hy", (-y * 8).toFixed(1) + "px");
    });
  });
  hero.addEventListener("pointerleave", () => { pic.style.setProperty("--hx", "0px"); pic.style.setProperty("--hy", "0px"); });
}
// Header shadow once the page scrolls (a 1px marker at the very top leaves the screen)
if ("IntersectionObserver" in window) {
  const marker = document.createElement("div");
  marker.setAttribute("aria-hidden", "true");
  marker.style.cssText = "position:absolute;top:0;left:0;width:1px;height:1px;pointer-events:none";
  document.body.prepend(marker);
  const top = document.querySelector(".top");
  new IntersectionObserver(([e]) => top.classList.toggle("scrolled", !e.isIntersecting)).observe(marker);
}

// Language menu
const menu = document.getElementById("lang-menu");
const langBtn = document.getElementById("lang-btn");
function drawMenu() {
  menu.innerHTML = `<p>Language · اللغة · Langue · زبان</p>` + LANGS.map(([code, name]) =>
    `<button type="button" role="menuitemradio" aria-checked="${code === lang}" data-lang="${code}" lang="${code}">${name}${code === lang ? '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7F3D" stroke-width="2.4"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ""}</button>`).join("");
  menu.querySelectorAll("[data-lang]").forEach((b) => (b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("gs-lang", lang); } catch (e) {}
    toggleMenu(false);
    render(false);
  }));
}
function toggleMenu(open) {
  menu.hidden = !open;
  langBtn.setAttribute("aria-expanded", String(open));
  if (open) { drawMenu(); menu.querySelector("[aria-checked='true']").focus(); }
}
langBtn.onclick = () => toggleMenu(menu.hidden);
document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".lang-wrap")) toggleMenu(false); });
// Contact Us: straight to the WhatsApp numbers in the footer, on any page (no page change)
document.getElementById("contact-link").onclick = (e) => {
  e.preventDefault();
  const phones = document.getElementById("footer-phones");
  phones.scrollIntoView({ behavior: calmMotion.matches ? "auto" : "smooth", block: "center" });
  const first = phones.querySelector("a");
  if (first) first.focus({ preventScroll: true });
  phones.classList.remove("flash"); void phones.offsetWidth; phones.classList.add("flash");
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { toggleMenu(false); langBtn.focus(); } });

window.addEventListener("hashchange", () => { tab = "auto"; render(); });
render();
</script>
